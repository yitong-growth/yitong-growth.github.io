name: Publish Yitong Growth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get course source
        uses: actions/checkout@v4
      - name: Prepare static course
        run: |
          mkdir -p dist
          unzip -q site.zip -d dist
          test -f dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload course
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v5
